# ============================================================
#  수학 교재 양식
#  이 파일을 복사해서 값만 고치면 '내 양식'이 됩니다.
#    md2hwpx --init-template 내양식.toml     (이 파일을 복사)
#    md2hwpx 교재.md --template 내양식.toml   (양식으로 변환)
#
#  길이 단위: mm (글자 크기·간격은 pt)
#  색: "#RRGGBB"  (예: "#2E74B5" 파랑, "#C00000" 빨강)
#  필요 없는 줄은 지우면 기본값이 쓰입니다.
# ============================================================

title = ""                    # 문서 정보의 제목 (비우면 파일 이름)

[page]
paper = "A4"                  # A4, A3, A5, B4, B5, LETTER 또는 [가로, 세로] (예: [188, 257])
landscape = false             # 가로 방향
margin = [20, 18, 18, 18]     # 여백 [위, 오른쪽, 아래, 왼쪽]
margin_header = 12            # 머리말 영역 높이
margin_footer = 12            # 꼬리말 영역 높이
columns = 1                   # 본문 단 수 (문서 중간에 \columns{2} 로 바꿀 수 있음)
column_gap = 8                # 단 사이 간격
column_line = true            # 단 사이 세로 구분선

[font]
body = "함초롬바탕"            # 본문 글꼴
heading = "함초롬돋움"          # 제목·문제 번호 글꼴
code = "굴림체"
size = 10.5                   # 본문 글자 크기 (pt)
line_spacing = 170            # 줄 간격 (%)
paragraph_spacing = 4         # 문단 뒤 간격 (pt)
color = "#000000"

[heading]
sizes = [20, 15, 12.5, 11, 10.5, 10]   # # ~ ###### 제목 크기 (pt)
color = "#1F3864"

[equation]
font = "HancomEQN"            # 한글 수식 글꼴 (옛 모양: "HYhwpEQ")
size = 0                      # 수식 크기 pt (0 = 주변 글자와 같게)

[table]
border_color = "#000000"
header_background = "#E7E6E6"

[header]                      # 머리말. {page}=쪽 번호, {total}=전체 쪽 수
text = ""
align = "right"

[footer]                      # 꼬리말
text = "- {page} -"
align = "center"

[chapter]
new_page = true               # # 대단원 제목마다 새 쪽에서 시작

# ------------------------------------------------------------
#  문제  ( ::: 문제 ... ::: )
# ------------------------------------------------------------
[problem]
number_format = "{n:02d}"     # 01, 02 …   ("{n}." → 1. 2. / "{chapter}-{n}" → 1-1, 1-2)
number_color = "#2E74B5"
number_size = 12
number_bold = true
indent = 9                    # 번호 다음 본문이 시작하는 위치 (mm)
reset = "chapter"             # chapter: 대단원마다 1번부터 / never: 끝까지 이어서
space_after = 6               # 문제 뒤 빈 공간 (풀이 공간, mm)

# ------------------------------------------------------------
#  정답과 해설  (문제의 [정답] [해설] 을 모아 책 뒤에)
# ------------------------------------------------------------
[answers]
title = "정답과 해설"
new_page = true
columns = 2                   # 해설 부분 단 수
column_line = true
quick_table = true            # 맨 앞에 빠른 정답표
quick_columns = 5             # 빠른 정답표 한 줄에 몇 문제
answer_label = "정답"

# ------------------------------------------------------------
#  상자  ( ::: 이름 제목 ... ::: )
#  kind = "bar"    : 색 띠 제목 + 내용
#         "inline" : 내용 첫머리에 이름표
#         "line"   : 왼쪽 굵은 세로줄
#         "plain"  : 테두리만
#  numbered = true 이면 '정의 1', '정의 2' … 처럼 번호가 붙습니다.
#  [box."새이름"] 을 추가하면 ::: 새이름 으로 바로 쓸 수 있습니다.
# ------------------------------------------------------------
[box."정의"]
kind = "bar"
numbered = true
border_color = "#2E74B5"
border_width = "0.25 mm"
title_background = "#2E74B5"
title_color = "#FFFFFF"
background = "#F3F7FC"

[box."정리"]
kind = "bar"
numbered = true
border_color = "#C55A11"
title_background = "#C55A11"
title_color = "#FFFFFF"
background = "#FDF5EF"

[box."공식"]
kind = "inline"
border_color = "#548235"
label_color = "#548235"
border_width = "0.4 mm"
background = "#F4F9F0"

[box."예제"]
kind = "inline"
numbered = true
border_color = "#7F7F7F"
label_color = "#1F3864"
border_width = "0.12 mm"
solution_label = "풀이"
solution_color = "#C55A11"

[box."증명"]
kind = "line"
border_color = "#A6A6A6"
label_color = "#595959"
border_width = "1.0 mm"

[box."참고"]
kind = "line"
border_color = "#7F7F7F"
label_color = "#595959"
background = "#F7F7F7"

[box."주의"]
kind = "line"
border_color = "#C00000"
label_color = "#C00000"
background = "#FFF5F5"
